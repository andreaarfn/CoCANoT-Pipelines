name: cocanot-pipelines

channels:
  - https://fsl.fmrib.ox.ac.uk/fsldownloads/fslconda/public/
  - conda-forge

dependencies:
  - python=3.12
  - tk

  # Unified React + pywebview dashboard runtime
  - numpy=2.5.2
  - nibabel=5.4.2
  - matplotlib=3.11.1
  - pillow=12.3.0
  - pymupdf=1.28.0
  - openpyxl=3.1.5
  - pyedflib=0.1.42
  - pyyaml=6.0.3

  # Imaging runtime and native tools
  - dcm2niix=1.0.20260416
  - fsl-flirt=2111.4
  - fslpy=3.29.1

  # Retained for imported project modules
  - flask=3.1.3

  - pip
  - pip:
      - pywebview==6.2.1
      - pydeface==2.1.0
