name: CoCANoT-Pipelines
version: "0.1.0"

installer_type: pkg

environment_file: ../../environment.yaml

company: CoCANoT
reverse_domain_identifier: org.cocanot.pipelines

pkg_name: CoCANoT-Pipelines
default_location_pkg: /Library

welcome_text: |
  Welcome to the CoCANoT Pipelines installer.

  This installer installs both the Imaging and Electrophysiology
  de-identification pipelines together with all required dependencies.

readme_text: |
  This installer includes:

    • Imaging Pipeline
    • Electrophysiology Pipeline
    • Python runtime
    • dcm2niix
    • FSL / FLIRT
    • PyDeface
    • All required Python packages

  No separate installation of Python, Conda, Homebrew, or FSL is required.

conclusion_text: |
  Installation completed successfully.

  You can now launch:

    • CoCANoT Imaging
    • CoCANoT Electrophysiology

initialize_conda: false
keep_pkgs: false
progress_notifications: true

extra_files:
  - ../../../pipeline_config.py: app/pipeline_config.py
  - ../../../pipeline_settings.json: app/pipeline_settings.json

  - ../../../ImagingPipeline/dashboard.py: app/ImagingPipeline/dashboard.py
  - ../../../ImagingPipeline/scripts/dicom_to_nifti.py: app/ImagingPipeline/scripts/dicom_to_nifti.py
  - ../../../ImagingPipeline/scripts/scrub_nifti_header.py: app/ImagingPipeline/scripts/scrub_nifti_header.py
  - ../../../ImagingPipeline/scripts/deface_nifti_with_pydeface.py: app/ImagingPipeline/scripts/deface_nifti_with_pydeface.py
  - ../../../ImagingPipeline/scripts/nifti_to_bids.py: app/ImagingPipeline/scripts/nifti_to_bids.py

  - ../../../ElectrophysiologyPipeline/dashboard.py: app/ElectrophysiologyPipeline/dashboard.py
  - ../../../ElectrophysiologyPipeline/scripts/scrub_edf_metadata.py: app/ElectrophysiologyPipeline/scripts/scrub_edf_metadata.py
  - ../../../ElectrophysiologyPipeline/scripts/compare_raw_and_scrubbed_edf.py: app/ElectrophysiologyPipeline/scripts/compare_raw_and_scrubbed_edf.py
  - ../../../ElectrophysiologyPipeline/scripts/convert_edf_to_bids.py: app/ElectrophysiologyPipeline/scripts/convert_edf_to_bids.py

post_install: ../../scripts/post_install_macos.sh