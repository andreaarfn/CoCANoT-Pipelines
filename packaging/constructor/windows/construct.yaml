name: CoCANoT-Pipelines
version: "0.2.0"
installer_type: exe
installer_filename: CoCANoT-Windows-x64.exe
environment_file: ../../environment/environment-windows.yaml
company: CoCANoT
reverse_domain_identifier: org.cocanot.pipelines
initialize_conda: false
register_envs: false
keep_pkgs: false
default_prefix: ${USERPROFILE}\\AppData\\Local\\CoCANoT\\runtime
extra_files:
  - ../../stage-windows/app_payload.zip: payload/app_payload.zip
  - ../../stage-windows/pip_packages.zip: payload/pip_packages.zip
  - ../../scripts/post_install_windows.bat: payload/post_install_windows.bat
post_install: ../../scripts/post_install_windows.bat
welcome_text: "IMAGING STEP 3C SETUP: After installing CoCANoT, the MRI defacing setup assistant opens automatically in a separate PowerShell window. Follow its prompts to approve WSL2, Ubuntu, FSL and PyDeface provisioning. Setup may require administrator approval, large downloads, and a Windows restart; CoCANoT will never restart Windows automatically. If you defer setup or need to resume after restarting, use Start Menu > CoCANoT > Complete MRI defacing setup. Installing the Windows app alone does not make Step 3C ready. Steps 3A and 3B, metadata, and electrophysiology do not require these Linux tools."
