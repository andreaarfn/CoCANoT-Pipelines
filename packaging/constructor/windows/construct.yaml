name: CoCANoT-Pipelines
version: "0.2.0"
installer_type: exe
installer_filename: CoCANoT-Windows-x64.exe
icon_image: ../../../assets/logo/logo-1024.png
environment_file: ../../environment/environment-windows.yaml
company: CoCANoT
reverse_domain_identifier: org.cocanot.pipelines
initialize_conda: false
register_envs: false
keep_pkgs: false
default_prefix: ${USERPROFILE}\\AppData\\Local\\CoCANoT\\runtime
extra_files:
  - ../../stage-windows/app_payload.zip: payload/app_payload.zip
  - ../../stage-windows/pip_packages.zip: payload/pip_packages.zip
  - ../../scripts/post_install_windows.bat: payload/post_install_windows.bat
post_install: ../../scripts/post_install_windows.bat
pre_uninstall: ../../scripts/pre_uninstall_windows.bat
welcome_text: "IMAGING STEP 3C: Windows users install WSL2 and Ubuntu themselves before using MRI defacing. In an Administrator PowerShell run: wsl --install -d Ubuntu. Restart if prompted, open Ubuntu once and create a Linux username/password. CoCANoT does not install WSL or Ubuntu and does not automatically launch the MRI defacing setup. To install FLIRT and PyDeface after Ubuntu is ready, choose Start Menu > CoCANoT > Complete defacing setup. Imaging Steps 3A/3B, metadata and electrophysiology do not require these Linux tools."
