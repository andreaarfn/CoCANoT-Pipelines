name: CoCANoT-Pipelines
version: "0.2.0"
installer_type: exe
installer_filename: CoCANoT-Windows-x64.exe
environment_file: ../../environment/environment-windows.yaml
company: CoCANoT
reverse_domain_identifier: org.cocanot.pipelines
initialize_conda: false
register_envs: false
keep_pkgs: false
default_prefix: ${USERPROFILE}\\AppData\\Local\\CoCANoT\\runtime
extra_files:
  - ../../stage-windows/app_payload.zip: payload/app_payload.zip
  - ../../stage-windows/pip_packages.zip: payload/pip_packages.zip
  - ../../scripts/post_install_windows.bat: payload/post_install_windows.bat
post_install: ../../scripts/post_install_windows.bat
welcome_text: "IMPORTANT - REQUIRED IMAGING SETUP: After installing CoCANoT, open Windows Start Menu > CoCANoT > Complete MRI defacing setup BEFORE using Imaging Step 3C. This guided setup installs/configures WSL2, Ubuntu, FSL and PyDeface with your approval. WSL setup may require a Windows restart and resuming setup afterward. Save your work first. CoCANoT never restarts Windows automatically. Steps 3A and 3B, metadata, and electrophysiology work without these Linux tools. Installing the Windows app alone does NOT make Step 3C ready."
