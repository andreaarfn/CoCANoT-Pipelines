name: CoCANoT-Pipelines
version: "0.2.0"
installer_type: exe
installer_filename: CoCANoT-Windows-x64.exe
environment_file: ../../environment/environment-windows.yaml
company: CoCANoT
reverse_domain_identifier: org.cocanot.pipelines
initialize_conda: false
register_envs: false
keep_pkgs: false
default_prefix: ${USERPROFILE}\\AppData\\Local\\CoCANoT\\runtime
extra_files:
  - ../../stage-windows/app_payload.zip: payload/app_payload.zip
  - ../../stage-windows/pip_packages.zip: payload/pip_packages.zip
  - ../../scripts/post_install_windows.bat: payload/post_install_windows.bat
post_install: ../../scripts/post_install_windows.bat
welcome_text: "CoCANoT-Pipelines installs and runs on Windows without WSL for metadata, electrophysiology, and imaging Steps 3A/3B. MRI defacing (Step 3C) is a required imaging workflow. Complete the included MRI defacing setup after installation to configure WSL2, Ubuntu, FSL, and PyDeface. Enabling or installing WSL2 may require a Windows restart. Save your work before WSL setup. Setup requires user approval and may need a restart; Windows will not be restarted automatically."
