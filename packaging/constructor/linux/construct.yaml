name: CoCANoT-Pipelines
version: "0.2.0"
installer_type: sh
installer_filename: CoCANoT-Linux.sh
environment_file: ../../environment/environment-linux.yaml
channels:
  - https://fsl.fmrib.ox.ac.uk/fsldownloads/fslconda/public/
  - conda-forge
company: CoCANoT
initialize_conda: false
register_envs: false
keep_pkgs: false
default_prefix: ${HOME}/.local/share/CoCANoT/runtime
extra_files:
  - ../../stage-linux/app_payload.tar.gz: payload/app_payload.tar.gz
  - ../../stage-linux/pip_packages.tar.gz: payload/pip_packages.tar.gz
  - ../../scripts/post_install_linux.sh: payload/post_install_linux.sh
post_install: ../../scripts/post_install_linux.sh
